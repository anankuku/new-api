name: Build Render image

on:
  push:
    branches:
      - token-group-priority
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Render 免费实例运行在常规 Linux amd64 环境，单架构镜像构建更快。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:token-group-priority
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment image
        run: |
          echo "Render image:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${GHCR_IMAGE}:token-group-priority\`" >> "$GITHUB_STEP_SUMMARY"
